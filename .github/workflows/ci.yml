name: CI

on:
  push:
    branches: [main]
  pull_request:

# The app talks to the Velynt agents API (velynt/api-agente), tested in that repository. Here: the
# app and the shared money package. The integration test against a running Velynt stack runs only
# when VELYNT_API_URL is set, so it is skipped in CI.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build
        run: pnpm -r build
      - name: Tests
        run: pnpm -r test
      - name: Mobile bundles (Android + web)
        working-directory: apps/agent-mobile
        run: |
          npx expo export --platform android --output-dir /tmp/android-bundle
          npx expo export --platform web --output-dir /tmp/web-bundle
